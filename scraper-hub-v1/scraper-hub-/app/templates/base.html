<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scraper Hub{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Scripts & Styles -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">Scraper Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catalog"><i class="fas fa-shopping-bag me-1"></i> Catalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="/services-catalog"><i class="fas fa-concierge-bell me-1"></i> Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="/intelligence"><i class="fas fa-chart-line me-1"></i> Intelligence</a></li>
                    <li class="nav-item"><a class="nav-link" href="/zimbabwe"><i class="fas fa-map-marker-alt me-1"></i> Zimbabwe</a></li>
                    <li class="nav-item"><a class="nav-link" href="/organizations">Organizations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sources">Sources</a></li>
                    <li class="nav-item"><a class="nav-link" href="/apis">APIs</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a class="btn btn-sm btn-outline-light me-2" href="/manual-scrape">
                        <i class="fas fa-plus me-1"></i> New Scrape
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="container py-5 mt-5 border-top border-secondary opacity-50">
        <div class="row">
            <div class="col-md-6">
                <p>&copy; 2026 Scraper Hub. Zimbabwe Market Intelligence Engine.</p>
            </div>
            <div class="col-md-6 text-md-end">
                <a href="/docs" class="text-info text-decoration-none">API Documentation</a>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
