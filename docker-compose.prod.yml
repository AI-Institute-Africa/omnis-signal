version: '3.8'

services:
  # Shared PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: omnis_postgres
    env_file:
      - .env
    volumes:
      - omnis_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnis_net
    restart: always

  # Shared Redis Broker
  redis:
    image: redis:7-alpine
    container_name: omnis_redis
    env_file:
      - .env
    volumes:
      - omnis_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnis_net
    restart: always

  # Qdrant Vector DB for AI Research RAG Search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnis_qdrant
    volumes:
      - omnis_qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6335:6333"
    healthcheck:
      # qdrant image has neither curl nor wget; bash's /dev/tcp is what's available
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnis_net
    restart: always

  # -------------------------------------------------------------
  # SCRAPER HUB SERVICE GROUP
  # -------------------------------------------------------------
  scraper_hub_web:
    build:
      context: ./scraper-hub-v1/scraper-hub-
      dockerfile: Dockerfile
    container_name: omnis_scraper_hub
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - omnis_net
    restart: always

  scraper_hub_worker:
    build:
      context: ./scraper-hub-v1/scraper-hub-
      dockerfile: Dockerfile
    container_name: omnis_scraper_worker
    env_file:
      - .env
    command: sh -c "rq worker default"
    depends_on:
      - scraper_hub_web
    networks:
      - omnis_net
    restart: always

  # -------------------------------------------------------------
  # AI RESEARCH INTELLIGENCE SERVICE GROUP
  # -------------------------------------------------------------
  ai_research_web:
    build:
      context: ./ai_research_intelligence
      dockerfile: Dockerfile
    container_name: omnis_ai_research
    env_file:
      - .env
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - omnis_net
    restart: always

  ai_research_worker:
    build:
      context: ./ai_research_intelligence
      dockerfile: Dockerfile.worker
    container_name: omnis_ai_worker
    env_file:
      - .env
    command: celery -A app.workers.celery_app worker -l info -c 4
    depends_on:
      - ai_research_web
    networks:
      - omnis_net
    restart: always

  ai_research_beat:
    build:
      context: ./ai_research_intelligence
      dockerfile: Dockerfile.beat
    container_name: omnis_ai_beat
    env_file:
      - .env
    command: celery -A app.workers.celery_app beat -l info
    depends_on:
      - ai_research_web
    networks:
      - omnis_net
    restart: always

volumes:
  omnis_pg_data:
  omnis_redis_data:
  omnis_qdrant_data:

networks:
  omnis_net:
    driver: bridge
